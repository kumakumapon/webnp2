name: Bundled PC-98 DOS disks

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Generate the CPANEL and KDESK DOS 4 image
        run: bash scripts/prepare-msdos4-cpanel-ci.sh
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Serve production assets under the Pages project path
        run: |
          npm run preview -- --host 127.0.0.1 --port 4173 --strictPort --base /webnp2/ > /tmp/webnp2-preview.log 2>&1 &
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4173/webnp2/ > /dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/webnp2-preview.log
          exit 1
      - name: Verify DOS disks, window desktop, BASIC, Japanese input and editor in Chromium
        env:
          CHROMIUM: /usr/bin/google-chrome
          WEBNP2_NO_SANDBOX: '1'
        run: |
          mkdir -p test-results/dos2
          node scripts/verify-msdos2.mjs http://127.0.0.1:4173/webnp2/ test-results/dos2/screen.png
          node scripts/verify-msdos4.mjs http://127.0.0.1:4173/webnp2/ test-results/dos4
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bundled-dos-browser-validation
          path: test-results/
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: msdos4-cpanel-pages-build
          path: |
            public/msdos4/*.xdf
            public/msdos4/manifest.json
            public/msdos4/LICENSE.txt
            public/msdos4/CPANEL.txt
            public/msdos4/KDESK.txt
            public/msdos4/KIMAGE.txt
            public/k386/*.xdf
            public/k386/manifest.json
            public/k386/LICENSE.txt
            public/k386/K386.txt

  k386-shell:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Generate pinned guest shell and DOS images
        run: bash scripts/prepare-msdos4-cpanel-ci.sh
      - run: npm ci
      - run: npm run build
      - name: Playwright guest shell, MZ and parent context validation
        env:
          CHROMIUM: /usr/bin/google-chrome
          WEBNP2_NO_SANDBOX: '1'
        run: |
          npm run preview -- --host 127.0.0.1 --port 4173 --strictPort --base /webnp2/ > /tmp/k386-shell-preview.log 2>&1 &
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4173/webnp2/ > /dev/null; then break; fi
            sleep 1
          done
          node scripts/verify-k386-shell.mjs http://127.0.0.1:4173/webnp2/ test-results/k386-shell
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: k386-shell-playwright-validation
          path: test-results/k386-shell/
          if-no-files-found: ignore

  k386-processes:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Generate pinned DOS process and XMS images
        run: bash scripts/prepare-msdos4-cpanel-ci.sh
      - run: npm ci
      - run: npm run build
      - name: Playwright XMS, nested DOS processes and BIOS timer validation
        env:
          CHROMIUM: /usr/bin/google-chrome
          WEBNP2_NO_SANDBOX: '1'
        run: |
          npm run preview -- --host 127.0.0.1 --port 4173 --strictPort --base /webnp2/ > /tmp/k386-processes-preview.log 2>&1 &
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4173/webnp2/ > /dev/null; then break; fi
            sleep 1
          done
          node scripts/verify-k386-processes.mjs http://127.0.0.1:4173/webnp2/ test-results/k386-processes
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: k386-processes-playwright-validation
          path: test-results/k386-processes/
          if-no-files-found: ignore

  k386:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Generate pinned normal and experimental images
        run: bash scripts/prepare-msdos4-cpanel-ci.sh
      - run: npm ci
      - run: npm run build
      - name: Playwright PC-98 K386 validation
        env:
          CHROMIUM: /usr/bin/google-chrome
          WEBNP2_NO_SANDBOX: '1'
        run: |
          npm run preview -- --host 127.0.0.1 --port 4173 --strictPort --base /webnp2/ > /tmp/k386-preview.log 2>&1 &
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4173/webnp2/ > /dev/null; then break; fi
            sleep 1
          done
          node scripts/verify-k386.mjs http://127.0.0.1:4173/webnp2/ test-results/k386
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: k386-playwright-validation
          path: test-results/k386/
          if-no-files-found: ignore

name: Update bundled MS-DOS 4 CPANEL image

on:
  push:
    branches: [codex/msdos4-cpanel]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-verify-update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: git clone --depth 1 https://github.com/kumakumapon/MS-DOS.git dos
      - name: Add CPANEL to the bundled disk
        run: python3 scripts/update-msdos4-cpanel.py dos
      - run: npm test
      - run: npm run build
      - name: Verify the production player and DOS 4 image
        env:
          CHROMIUM: /usr/bin/google-chrome
          WEBNP2_NO_SANDBOX: '1'
        run: |
          npm run preview -- --host 127.0.0.1 --port 4173 --strictPort > /tmp/webnp2-preview.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4173/ > /dev/null; then break; fi
            sleep 1
          done
          node scripts/verify-msdos4.mjs http://127.0.0.1:4173/
      - name: Commit the generated image into this PR
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add public/msdos4 README.md README.ja.md
          if git diff --cached --quiet; then
            echo 'No image update needed.'
            exit 0
          fi
          git commit -m "Update bundled MS-DOS 4 image with CPANEL"
          git push origin "HEAD:${BRANCH}"

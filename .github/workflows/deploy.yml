name: Deploy to GitHub Pages
on:
  workflow_run:
    workflows: ['WebNP2 CI']
    types: [completed]
    branches: [master]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  prepare:
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/master') ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      current: ${{ steps.current.outputs.current }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || 'master' }}
      - id: current
        uses: actions/github-script@v7
        env:
          ACCEPTED_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
        with:
          script: |
            const {data} = await github.rest.repos.getBranch({...context.repo,branch:'master'});
            core.setOutput('current',data.commit.sha === process.env.ACCEPTED_SHA);
      - if: steps.current.outputs.current == 'true' && github.event_name == 'workflow_dispatch'
        uses: ./.github/actions/build
        env:
          VITE_DISK_PROXY: ${{ vars.DISK_PROXY_URL }}
      - if: steps.current.outputs.current == 'true' && github.event_name == 'workflow_run'
        uses: actions/download-artifact@v4
        with:
          name: webnp2-build
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - if: steps.current.outputs.current == 'true'
        uses: actions/configure-pages@v5
      - if: steps.current.outputs.current == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    if: needs.prepare.outputs.current == 'true'
    timeout-minutes: 15
    needs: prepare
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
        with:
          timeout: 600000

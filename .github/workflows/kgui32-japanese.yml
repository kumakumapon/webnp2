name: KGUI32 Japanese text
on:
  push:
    branches: [master, 'feature/gui-shiftjis-distribution']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: kgui32-japanese-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}
jobs:
  japanese:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        video: [pegc, cirrus]
        suite: [text, save]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Generate pinned native Japanese desktop and HDD/FD distribution
        run: bash scripts/prepare-msdos4-cpanel-ci.sh
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Native CG-ROM pixels, editor boundaries and Shift-JIS save/cold boot
        env:
          CHROMIUM: /usr/bin/google-chrome
          WEBNP2_NO_SANDBOX: '1'
        run: |
          npm run preview -- --host 127.0.0.1 --port 4173 --strictPort --base /webnp2/ > /tmp/japanese-preview.log 2>&1 &
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4173/webnp2/ > /dev/null; then break; fi
            sleep 1
          done
          node scripts/verify-kgui32-japanese.mjs http://127.0.0.1:4173/webnp2/ test-results/japanese ${{ matrix.video }} ${{ matrix.suite }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kgui32-japanese-${{ matrix.suite }}-${{ matrix.video }}
          path: |
            test-results/japanese
            public/kgui32/manifest.json
            /tmp/japanese-preview.log

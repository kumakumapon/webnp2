name: Standalone PC-98 HDD boot
on:
  push:
    branches: [master, 'feature/hdd-standalone-boot']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: hdd-boot-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}
jobs:
  hdd-boot:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        video: [pegc, cirrus]
        suite: [boot, v86, rejection]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Build pinned HDD OEM and distribution from source
        run: bash scripts/prepare-msdos4-cpanel-ci.sh
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Native HDD-only boot, apps, retention and refusal
        env:
          CHROMIUM: /usr/bin/google-chrome
          WEBNP2_NO_SANDBOX: '1'
        run: |
          npm run preview -- --host 127.0.0.1 --port 4173 --strictPort --base /webnp2/ > /tmp/hdd-boot-preview.log 2>&1 &
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4173/webnp2/ > /dev/null; then break; fi
            sleep 1
          done
          node scripts/verify-hdd-boot.mjs http://127.0.0.1:4173/webnp2/ test-results/hdd-boot ${{ matrix.video }} ${{ matrix.suite }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hdd-boot-${{ matrix.suite }}-${{ matrix.video }}
          path: |
            test-results/hdd-boot
            public/kgui32/manifest.json
            /tmp/hdd-boot-preview.log
